tantivy_folder = ".index.tantivy"
port = 1730 # TCP port for Rust-Emacs API communication.
timing_log = true

# Paths are relative to this file's folder, data/jeff/.

# NOTE: repos are listed in privacy order, most public first.
# To choose a privacy level is to name one of those repos,
# which causes everything above it to be included.

[[repos]]
name = "public"
path = "public"

[[repos]]
name = "pers-i"
path = "personal-ish"

[[repos]]
name = "decid"
path = "deciduous"

[[repos]]
name = "pers-p"
path = "personal-proc"

[[repos]]
name = "pers-dep"
path = "personal-deprecated"

[[repos]]
name = "pers-m"
path = "personal-most"

